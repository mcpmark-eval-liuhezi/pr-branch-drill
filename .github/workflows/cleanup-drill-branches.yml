name: cleanup-drill-branches
on: push
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale drill branches
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for BR in feature drill-probe drill/foo; do
            ENCODED=$(echo "${BR}" | sed 's|/|%2F|g')
            HTTP=$(curl -s -X DELETE \
              -H "Authorization: token ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/git/refs/heads/${ENCODED}" \
              -o /dev/null -w "%{http_code}")
            echo "delete ${BR}: HTTP ${HTTP}"
            case "${HTTP}" in
              204) echo "deleted ${BR}" ;;
              422) echo "branch ${BR} gone or protected" ;;
              *) echo "unexpected status for ${BR}: ${HTTP}"; exit 1 ;;
            esac
          done
